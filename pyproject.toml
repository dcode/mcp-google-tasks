[project]
name = "mcp-google-tasks"
dynamic = ["version"]
description = "Google Tasks MCP server for Obot: multi-user OAuth or single-user tokens."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Derek Ditch", email = "dcode@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=44.0.0",
    "cyclopts>=5.5.2",
    "fastmcp>=4.2.4",
    "httpx>=0.28.0",
    "py-key-value-aio[filetree,redis]>=0.4.0",
    "pydantic>=2.10.0",
    "structlog>=26.1.0",
]

[project.scripts]
mcp-google-tasks = "mcp_google_tasks.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "ty>=0.0.108",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mcp_google_tasks/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_google_tasks"]

# Default environment: `hatch run <script>` and `hatch shell`.
[tool.hatch.envs.default]
installer = "uv"
dependency-groups = ["dev"]

[tool.hatch.envs.default.scripts]
types = "ty check {args}"
hooks = "pre-commit run --all-files {args}"
check = [
    "hooks",
    "pytest",
]

# `hatch test`: coverage comes from pytest-cov (see [tool.pytest.ini_options]),
# so plain runs and `--cover` runs behave the same and both enforce the threshold.
[tool.hatch.envs.hatch-test]
installer = "uv"
default-args = ["tests"]
extra-dependencies = [
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.14"]

[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
run-cov = "pytest{env:HATCH_TEST_ARGS:} {args}"
cov-combine = "python -c \"\""
cov-report = "coverage report"

# `hatch fmt`: use this project's [tool.ruff] settings instead of hatch's defaults.
[tool.hatch.envs.hatch-static-analysis]
installer = "uv"
config-path = "none"
dependencies = ["ruff>=0.17"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--cov", "--cov-report=term-missing:skip-covered"]

[tool.coverage.run]
source = ["mcp_google_tasks"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN", "ASYNC", "PT", "S", "RUF"]
# D203/D213 conflict with D211/D212, which the google convention keeps.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests use assert by design (S101) and need neither docstrings nor return annotations.
"tests/*" = ["D", "ANN", "ASYNC240", "S101"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.rumdl]
line-length = 100
exclude = [".venv", "LICENSE"]

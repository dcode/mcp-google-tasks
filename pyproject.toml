[project]
name = "mcp-google-tasks"
# The readme comes from hatch-fancy-pypi-readme (below), which makes its relative links absolute.
dynamic = ["version", "readme"]
description = "Google Tasks MCP server for Obot: multi-user OAuth or single-user tokens."
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Derek Ditch", email = "dcode@users.noreply.github.com" }]
# 3.12 is the floor: the code uses `type` aliases and PEP 695 generics. CI tests 3.12 to 3.15.
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "google-tasks", "obot", "fastmcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Scheduling",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=44.0.0",
    "cyclopts>=5.5.2",
    "fastmcp>=4.2.4",
    "httpx>=0.28.0",
    "py-key-value-aio[filetree,redis]>=0.4.0",
    "pydantic>=2.10.0",
    "structlog>=26.1.0",
]

[project.urls]
Homepage = "https://github.com/dcode/mcp-google-tasks"
Documentation = "https://github.com/dcode/mcp-google-tasks/tree/main/docs"
Issues = "https://github.com/dcode/mcp-google-tasks/issues"
Changelog = "https://github.com/dcode/mcp-google-tasks/releases"
Container = "https://github.com/dcode/mcp-google-tasks/pkgs/container/mcp-google-tasks"

[project.scripts]
mcp-google-tasks = "mcp_google_tasks.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "ty>=0.0.108",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=25.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mcp_google_tasks/__init__.py"

# PyPI renders README.md but cannot follow its relative links, so point them at GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Inline links: ](docs/tools.md) -> ](https://github.com/.../blob/main/docs/tools.md)
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)\s]+)\)'
replacement = '](https://github.com/dcode/mcp-google-tasks/blob/main/\1)'

# Reference definitions: [license]: LICENSE -> [license]: https://github.com/.../LICENSE
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^(\[[^\]]+\]: )(?!https?://)(\S+)$'
replacement = '\1https://github.com/dcode/mcp-google-tasks/blob/main/\2'

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_google_tasks"]

# Default environment: `hatch run <script>` and `hatch shell`.
[tool.hatch.envs.default]
installer = "uv"
dependency-groups = ["dev"]

[tool.hatch.envs.default.scripts]
types = "ty check {args}"
hooks = "pre-commit run --all-files {args}"
check = [
    "hooks",
    "pytest",
]

# `hatch test`: coverage comes from pytest-cov (see [tool.pytest.ini_options]),
# so plain runs and `--cover` runs behave the same and both enforce the threshold.
[tool.hatch.envs.hatch-test]
installer = "uv"
default-args = ["tests"]
extra-dependencies = [
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.12", "3.13", "3.14", "3.15"]

[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
run-cov = "pytest{env:HATCH_TEST_ARGS:} {args}"
cov-combine = "python -c \"\""
cov-report = "coverage report"

# `hatch fmt`: use this project's [tool.ruff] settings instead of hatch's defaults.
[tool.hatch.envs.hatch-static-analysis]
installer = "uv"
config-path = "none"
dependencies = ["ruff>=0.17"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--cov", "--cov-report=term-missing:skip-covered"]

[tool.coverage.run]
source = ["mcp_google_tasks"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
# The oldest supported version, so neither tool accepts anything newer.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN", "ASYNC", "PT", "S", "RUF"]
# D203/D213 conflict with D211/D212, which the google convention keeps.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests use assert by design (S101) and need neither docstrings nor return annotations.
"tests/*" = ["D", "ANN", "ASYNC240", "S101"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.rumdl]
line-length = 100
exclude = [".venv", "LICENSE"]

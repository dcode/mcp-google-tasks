version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      python-dependencies:
        patterns: ["*"]
  # Base images in the Dockerfile (python:3.15-slim and the pinned uv image). A Python
  # bump must also change UV_PYTHON in the Dockerfile, so it needs a manual follow-up.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      container-images:
        patterns: ["*"]

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      python-dependencies:
        patterns: ["*"]
  # Base images in the Dockerfile (python:3.14-slim and the pinned uv image).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      container-images:
        patterns: ["*"]

name: Release

# Push a tag like v0.2.0 (matching __version__) to test, build, publish the sdist and wheel
# to PyPI, then publish a GitHub release with them attached. The container image is
# published separately by container.yml.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify-version:
    name: Tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag with __version__
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' src/mcp_google_tasks/__init__.py)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match __version__ ${version}"
            exit 1
          fi

  ci:
    name: CI
    needs: verify-version
    uses: ./.github/workflows/ci.yml
    # A called workflow may not ask for more than its caller grants, and ci.yml's test job
    # asks for pull-requests: write (its comment step runs only on pull requests).
    permissions:
      contents: read
      pull-requests: write

  # PyPI first: an upload cannot be redone under the same version, while a failed GitHub
  # release can simply be re-run. Uses trusted publishing (OIDC), so there is no API token;
  # PyPI's publisher for this project names this workflow file and the `pypi` environment.
  pypi:
    name: Publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-google-tasks/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Uploads digital attestations alongside the files by default.
      - uses: pypa/gh-action-pypi-publish@v1.14.3

  release:
    name: Publish GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create release with build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" dist/* --title "${TAG}" --generate-notes --verify-tag

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the release workflow run the same checks before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, format and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run pre-commit hooks (ruff, rumdl, taplo, ty)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # For the coverage comment on pull requests.
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests with coverage (fails below the threshold in pyproject.toml)
        # The JUnit and Cobertura XML files feed the pull request comment below.
        run: uv run pytest --junitxml=pytest.xml --cov-report=xml:coverage.xml
      - name: Write coverage to the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Coverage (${{ matrix.os }})"
            echo
            uv run coverage report --format=markdown --skip-covered --skip-empty
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment test results and coverage on the pull request
        # One comment per pull request, updated on each push; Linux only, to avoid two
        # identical comments. Skipped for forks, whose token cannot write comments.
        if: >-
          ${{ !cancelled()
              && github.event_name == 'pull_request'
              && matrix.os == 'ubuntu-latest'
              && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: MishaKav/pytest-coverage-comment@v1.13.1
        with:
          pytest-xml-coverage-path: coverage.xml
          junitxml-path: pytest.xml
          junitxml-title: Tests
          # The threshold is 100%, so the table lists only files that fall short.
          xml-skip-covered: true
          show-failed-tests: true
          annotate-missing-lines: true

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - name: Install the wheel into a clean environment and run it
        run: |
          uv venv --python 3.14 /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          /tmp/wheel-check/bin/mcp-google-tasks --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  container:
    name: Build and smoke-test container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (local only, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mcp-google-tasks:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
      - name: Run the image and wait for /health
        # A dummy access token is enough: the server starts without calling Google, and
        # /health is unauthenticated. token mode is required because http transport
        # otherwise defaults to oauth-proxy, which needs real OAuth client settings.
        run: |
          docker run --detach --name mcp-smoke --publish 8000:8000 \
            --env MCP_AUTH_MODE=token \
            --env GOOGLE_OAUTH_ACCESS_TOKEN=dummy \
            mcp-google-tasks:ci
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health)" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health did not return 200 within 30 seconds"
          docker logs mcp-smoke
          exit 1
      - name: Remove the container
        if: always()
        run: docker rm --force mcp-smoke || true
